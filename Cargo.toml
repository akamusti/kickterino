[package]
name = "kickterino"
version = "0.6.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui = "0.37"
tokio = { version = "1", features = ["full"] }
kick-api = "0.1.9"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
