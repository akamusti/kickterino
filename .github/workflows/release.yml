name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/kickterino AppDir/usr/bin/
          cat > AppDir/usr/share/applications/kickterino.desktop <<'EOF'
          [Desktop Entry]
          Name=kickterino
          Exec=kickterino
          Icon=kickterino
          Type=Application
          Categories=Network;Chat;
          EOF
          cp assets/icon.svg AppDir/usr/share/icons/hicolor/256x256/apps/kickterino.svg
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir kickterino-x86_64.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kickterino-linux-appimage
          path: kickterino-*.AppImage
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: kickterino-*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kickterino-windows-exe
          path: target/release/kickterino.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/kickterino.exe
